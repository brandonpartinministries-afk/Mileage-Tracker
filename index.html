<meta name="apple-mobile-web-app-title" content="Mileage">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7380;--bd:#e2e5ea;--ac:#0b7a5b;--acx:#fff;--dg:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1d2125;--tx:#eceff2;--mut:#9aa3ad;--bd:#2e343a;--ac:#35c79a;--acx:#06251b;--dg:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1d2125;--tx:#eceff2;--mut:#9aa3ad;--bd:#2e343a;--ac:#35c79a;--acx:#06251b;--dg:#ff7b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mut)}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select{width:100%;min-width:0;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 24px;margin-bottom:12px}.row>div{min-width:0}input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;height:46px;text-align:left;overflow:hidden}input[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0}
button{font:inherit;border:0;border-radius:9px;padding:11px 14px;cursor:pointer;background:var(--ac);color:var(--acx);font-weight:600}
button.g{background:transparent;color:var(--mut);border:1px solid var(--bd);font-weight:500;padding:6px 10px;font-size:13px}
.full{width:100%}
.trip{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.trip:first-child{border-top:0}
.trip small{color:var(--mut);display:block}
.trip .m{font-weight:700;white-space:nowrap;text-align:right}
.x{background:none;color:var(--dg);padding:0;font-size:12px;font-weight:500}
.empty{color:var(--mut);text-align:center;padding:14px}
.note{font-size:12px;color:var(--mut);text-align:center}
</style>
</head>
<body>
<main>
  <h1>Mileage Log <button class="g" id="unit">mi</button></h1>
  <div class="card stats">
    <div class="stat"><b id="sMonth">0</b><span>This month</span></div>
    <div class="stat"><b id="sBiz">0</b><span>Business</span></div>
    <div class="stat"><b id="sAll">0</b><span>All time</span></div>
  </div>
  <div class="card">
    <div class="row">
      <div><label for="date">Date</label><input type="date" id="date"></div>
      <div><label for="dist" id="distL">Distance (mi)</label><input type="number" id="dist" inputmode="decimal" min="0" step="0.1" placeholder="0.0"></div>
    </div>
    <div class="row">
      <div><label for="odoS">Odometer start (optional)</label><input type="number" id="odoS" inputmode="decimal" min="0" placeholder="0"></div>
      <div><label for="odoE">Odometer end</label><input type="number" id="odoE" inputmode="decimal" min="0" placeholder="0"></div>
    </div>
    <div class="row">
      <div><label for="from">From (location &amp; address)</label><input id="from" placeholder="Home"></div>
      <div><label for="to">To (location &amp; address)</label><input id="to" placeholder="Office"></div>
    </div>
    <div class="row">
      <div><label for="type">Type</label><select id="type"><option>Business</option><option>Personal</option><option>Medical</option><option>Charity</option></select></div>
      <div><label for="client">Client (e.g. R. Thomas)</label><input id="client"></div>
    </div>
    <div style="margin-bottom:12px"><label for="memo">Purpose of errand (or notes)</label><input id="memo" placeholder="Pick up medications"></div>
    <button class="full" id="add">Save trip</button>
  </div>
  <div class="card">
    <div class="row">
      <div><label for="mon">Month</label><select id="mon"><option value="all">All months</option></select></div>
      <div><label for="rate">Rate per mile ($)</label><input type="number" id="rate" inputmode="decimal" min="0" step="0.001" placeholder="0.00"></div>
    </div>
    <div style="display:flex;justify-content:space-between;gap:8px"><span id="sumTxt" class="note"></span><span class="note">Business reimbursement: <b id="reimb">—</b></span></div>
  </div>
  <div class="card" id="list"></div>
  <div class="card">
    <div style="font-weight:600;margin-bottom:10px">Reimbursement form details</div>
    <div class="row"><div><label for="pName">Printed name of employee</label><input id="pName"></div><div><label for="pNum">Employee number</label><input id="pNum"></div></div>
    <div class="row"><div><label for="pAddr">Home address</label><input id="pAddr"></div><div><label for="pCoord">Service coordinator</label><input id="pCoord"></div></div>
    <div class="row"><div><label for="pBr">Branch #</label><input id="pBr"></div><div><label for="pFax">Branch fax #</label><input id="pFax"></div></div>
    <button class="full" id="pdf">Export reimbursement form (PDF)</button>
    <p class="note" style="margin:8px 0 0">Fills the form with the trips shown for the selected month (Personal trips are left out).</p>
  </div>
  <div style="display:flex;gap:8px;justify-content:center"><button class="g" id="csv">Export CSV</button></div>
  <p class="note" id="where"></p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  var trips=[], unit="mi", rate=0, mon="all", col=null, K="mileage-trips-v1", $=function(i){return document.getElementById(i)};
  var KM=1.609344;
  try{var u=localStorage.getItem("mileage-unit"); if(u)unit=u;var rr=parseFloat(localStorage.getItem("mileage-rate"));if(rr>0)rate=rr;}catch(e){}
  function today(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
  $("date").value=today();
  function show(mi){var v=unit==="km"?mi*KM:mi;return (Math.round(v*10)/10).toLocaleString()+" "+unit}
  function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
  function render(){
    trips.sort(function(a,b){return b.date.localeCompare(a.date)||b.ts-a.ts});
    var ym=today().slice(0,7),all=0,mo=0,biz=0;
    trips.forEach(function(t){all+=t.miles;if(t.date.slice(0,7)===ym)mo+=t.miles;if(t.type==="Business")biz+=t.miles});
    $("sAll").textContent=show(all);$("sMonth").textContent=show(mo);$("sBiz").textContent=show(biz);
    $("unit").textContent=unit;$("distL").textContent="Distance ("+unit+")";
    var l=$("list");var shown=trips.filter(function(t){return mon==="all"||t.date.slice(0,7)===mon});fillMonths();shown=trips.filter(function(t){return mon==="all"||t.date.slice(0,7)===mon});var sm=0,sb=0;shown.forEach(function(t){sm+=t.miles;if(t.type==="Business")sb+=t.miles});$("sumTxt").textContent=shown.length+" trips · "+show(sm);$("reimb").textContent=rate>0?"$"+(sb*rate).toFixed(2):"—";
    if(!shown.length){l.innerHTML='<div class="empty">No trips yet. Add your first one above.</div>';return}
    l.innerHTML=shown.map(function(t){
      var route=(t.from||t.to)?esc((t.from||"?")+" → "+(t.to||"?")):"Trip";
      return '<div class="trip"><div>'+route+'<small>'+esc(t.date)+' · '+esc(t.type)+(t.client?' · '+esc(t.client):'')+(t.memo?' · '+esc(t.memo):'')+(t.odoEnd!=null?' · odo '+esc(t.odoStart+'–'+t.odoEnd+' '+t.odoUnit):'')+'</small></div><div><div class="m">'+show(t.miles)+'</div><button class="x" data-id="'+esc(t.id)+'">Delete</button></div></div>'
    }).join("");
  }
  function fillMonths(){var s=$("mon"),ms=[];trips.forEach(function(t){var m=t.date.slice(0,7);if(ms.indexOf(m)<0)ms.push(m)});ms.sort().reverse();if(mon!=="all"&&ms.indexOf(mon)<0)mon="all";var key=ms.join();if(s.getAttribute("data-k")!==key){s.innerHTML='<option value="all">All months</option>'+ms.map(function(m){return '<option>'+m+'</option>'}).join("");s.setAttribute("data-k",key)}s.value=mon}
  function fmtD(s){var a=s.split('-');return (+a[1])+'/'+(+a[2])+'/'+a[0]}
  function fit(d,s,x,y,w,sz){s=String(s||'');d.setFontSize(sz);while(sz>6&&d.getTextWidth(s)>w){sz-=0.5;d.setFontSize(sz)}d.text(s,x,y)}
  function cell(d,s,x,y,w){d.setFontSize(8);var l=d.splitTextToSize(String(s||''),w-8).slice(0,2);if(l.length)d.text(l,x+4,l.length>1?y+11:y+16)}
  function drawPage(d,p,rows,pg,pages){
    var X=36,W=720,y=118;
    d.setLineWidth(0.8);d.setDrawColor(0);d.setTextColor(0);
    d.setFont('helvetica','bold');d.setFontSize(18);d.text('ERRAND MILES REIMBURSEMENT FORM',X,62);
    d.setFont('helvetica','normal');d.rect(560,34,196,40);d.setFontSize(8);
    fit(d,'BRANCH #: '+p.pBr,566,50,184,8);fit(d,'BRANCH FAX #: '+p.pFax,566,66,184,8);
    d.setFontSize(7.5);
    d.text(d.splitTextToSize('This form is to be used for reporting miles for shopping and errands as authorized. As a reminder, errands should be completed at a location that is closest to the client\'s home. You are required to contact the office in advance for doctor appointments. These trips are limited to one day per week, per client. A valid Driver\'s License and current vehicle insurance are required for reimbursement. The timeframe to submit this document is consistent with payroll deadlines.',W),X,88);
    d.rect(X,y,W,52);d.line(X,y+26,X+W,y+26);d.line(X+500,y,X+500,y+52);
    d.setFontSize(7);
    d.text('PRINTED NAME OF EMPLOYEE:',X+4,y+9);d.text('EMPLOYEE NUMBER:',X+504,y+9);
    d.text('EMPLOYEE\'S HOME ADDRESS:',X+4,y+35);d.text('NAME OF SERVICE COORDINATOR:',X+504,y+35);
    fit(d,p.pName,X+4,y+21,488,10);fit(d,p.pNum,X+504,y+21,212,10);fit(d,p.pAddr,X+4,y+47,488,10);fit(d,p.pCoord,X+504,y+47,212,10);
    var cw=[70,118,100,190,192,50],cx=[X],i;for(i=0;i<6;i++)cx.push(cx[i]+cw[i]);
    var hy=y+52,hh=28,rh=26,n=8;
    d.rect(X,hy,W,hh);d.rect(X,hy+hh,W,rh*n);
    for(i=1;i<6;i++)d.line(cx[i],hy,cx[i],hy+hh+rh*n);
    for(i=1;i<n;i++)d.line(X,hy+hh+i*rh,X+W,hy+hh+i*rh);
    var hd=[['DATE','(month/day/year)'],['INDICATE PURPOSE','FOR ERRAND'],['FIRST INITIAL &','LAST NAME OF CLIENT'],['BEGINNING LOCATION & ADDRESS'],['ENDING LOCATION & ADDRESS'],['TOTAL','# OF MILES']];
    d.setFontSize(7);
    for(i=0;i<6;i++)d.text(hd[i],cx[i]+cw[i]/2,hy+(hd[i].length>1?11:17),{align:'center'});
    var sum=0;
    rows.forEach(function(t,r){
      var ry=hy+hh+r*rh,m=Math.round(t.miles*10)/10;sum+=t.miles;
      cell(d,fmtD(t.date),cx[0],ry,cw[0]);cell(d,t.memo,cx[1],ry,cw[1]);cell(d,t.client,cx[2],ry,cw[2]);
      cell(d,t.from,cx[3],ry,cw[3]);cell(d,t.to,cx[4],ry,cw[4]);cell(d,String(m),cx[5],ry,cw[5]);
    });
    var ty=hy+hh+rh*n;
    d.setFillColor(0,0,0);d.rect(X,ty,cx[4]-X,16,'F');
    d.rect(cx[4],ty,cw[4]+cw[5],16);d.line(cx[5],ty,cx[5],ty+16);
    d.setFont('helvetica','bold');d.setFontSize(8);d.text('TOTAL NUMBER OF MILES:',cx[5]-6,ty+11,{align:'right'});
    d.text(String(Math.round(sum*10)/10),cx[5]+cw[5]/2,ty+11,{align:'center'});
    d.setFont('helvetica','bolditalic');d.setFontSize(9);
    d.text(['EMPLOYEE ACKNOWLEDGEMENT: I hereby certify that this Errand Miles Form','accurately reflects all travel miles during the pay period.'],X+10,ty+50);
    d.setFont('helvetica','normal');
    d.text('SIGNATURE OF EMPLOYEE:',X+10,ty+90);d.line(X+130,ty+91,X+390,ty+91);
    d.text('DATE:',X+10,ty+114);d.line(X+42,ty+115,X+170,ty+115);
    d.rect(X+470,ty+34,250,106);d.setFontSize(7);
    d.text('OFFICE USE ONLY:  All miles are entered as HCEML.',X+478,ty+48);
    d.text('Number of Clients: ________   Number of Miles: ________',X+478,ty+68);
    d.text('INITIALS OF SUPERVISORY REVIEW: ______________',X+478,ty+88);
    d.text('Admin Comments:',X+478,ty+108);
    d.setFontSize(6.5);d.text('4/3/18 DK, APPROVED BY LB, 4/24/18 DK, 5/14/19 (CH, MH, DK)',X,592);
    if(pages>1)d.text('Page '+pg+' of '+pages,X+W,592,{align:'right'});
  }
  function saveLocal(){try{localStorage.setItem(K,JSON.stringify(trips))}catch(e){}}
  function loadLocal(){try{trips=JSON.parse(localStorage.getItem(K)||"[]")||[]}catch(e){trips=[]}}
  async function add(){
    var os=parseFloat($("odoS").value),oe=parseFloat($("odoE").value),d=parseFloat($("dist").value);var hasO=oe>os&&os>=0;if(!(d>0)&&hasO)d=oe-os;
    if(!(d>0)){$("dist").focus();return}
    var t={id:"trip_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts:Date.now(),date:$("date").value||today(),
      miles:unit==="km"?d/KM:d,from:$("from").value.trim(),to:$("to").value.trim(),type:$("type").value,memo:$("memo").value.trim(),client:$("client").value.trim()};if(hasO){t.odoStart=os;t.odoEnd=oe;t.odoUnit=unit}
    $("dist").value="";$("memo").value="";$("odoS").value=hasO?oe:"";$("odoE").value="";
    if(col){try{await col.doc(t.id).set(t)}catch(e){fallback();trips.push(t);saveLocal();render()}}
    else{trips.push(t);saveLocal();render()}
  }
  function fallback(){col=null;$("where").textContent="Saved in this browser only."}
  $("add").onclick=add;
  $("unit").onclick=function(){unit=unit==="mi"?"km":"mi";try{localStorage.setItem("mileage-unit",unit)}catch(e){}render()};
  $("list").onclick=async function(e){
    var id=e.target.getAttribute&&e.target.getAttribute("data-id"); if(!id)return;
    if(col){try{await col.doc(id).delete()}catch(x){}}
    else{trips=trips.filter(function(t){return t.id!==id});saveLocal();render()}
  };
  $("csv").onclick=async function(){
    var rows=[["Date","Miles","Kilometers","From","To","Type","Notes","Odometer start","Odometer end","Reimbursement"]].concat(trips.filter(function(t){return mon==="all"||t.date.slice(0,7)===mon}).map(function(t){return [t.date,t.miles.toFixed(1),(t.miles*KM).toFixed(1),t.from,t.to,t.type,t.memo,t.odoStart==null?"":t.odoStart,t.odoEnd==null?"":t.odoEnd,t.type==="Business"&&rate>0?(t.miles*rate).toFixed(2):""]}));
    var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
    try{var dl=window.claude&&await window.claude.use("downloads"); if(dl){await dl.save({filename:"mileage-log.csv",data:csv});return}}catch(e){}
    try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="mileage-log.csv";a.click()}catch(e){}
  };
  $("rate").value=rate||"";
  $("rate").oninput=function(){rate=parseFloat($("rate").value)||0;try{localStorage.setItem("mileage-rate",rate)}catch(e){}render()};
  $("mon").onchange=function(){mon=$("mon").value;render()};
  function od(){var s=parseFloat($("odoS").value),e=parseFloat($("odoE").value);if(e>s&&s>=0)$("dist").value=Math.round((e-s)*10)/10}
  $("odoS").oninput=od;$("odoE").oninput=od;
  var PF=['pName','pNum','pAddr','pCoord','pBr','pFax'];
  function getP(){var p={};PF.forEach(function(k){p[k]=$(k).value.trim()});return p}
  try{var sp=JSON.parse(localStorage.getItem('mileage-profile')||'{}');PF.forEach(function(k){if(sp[k])$(k).value=sp[k]})}catch(e){}
  PF.forEach(function(k){$(k).oninput=function(){var p=getP();try{localStorage.setItem('mileage-profile',JSON.stringify(p))}catch(e){}if(col){try{col.doc('profile').set(p).catch(function(){})}catch(e){}}}});
  $('pdf').onclick=async function(){
    var J=window.jspdf&&window.jspdf.jsPDF;
    if(!J){$('where').textContent='The PDF tool did not load. Check your connection and try again.';return}
    var rows=trips.filter(function(t){return t.type!=='Personal'&&(mon==='all'||t.date.slice(0,7)===mon)}).sort(function(a,b){return a.date.localeCompare(b.date)||a.ts-b.ts});
    if(!rows.length){$('where').textContent='No trips to export for this selection.';return}
    var p=getP(),doc=new J({orientation:'landscape',unit:'pt',format:'letter'}),per=8,pages=Math.ceil(rows.length/per);
    for(var pg=0;pg<pages;pg++){if(pg)doc.addPage();drawPage(doc,p,rows.slice(pg*per,pg*per+per),pg+1,pages)}
    var dl=null;try{dl=window.claude&&await window.claude.use('downloads')}catch(e){}
    if(dl){try{await dl.save({filename:'errand-miles-reimbursement.pdf',data:doc.output('blob')})}catch(e){}}
    else{doc.save('errand-miles-reimbursement.pdf')}
  };
  loadLocal();render();$("where").textContent="Saved in this browser only.";
  (async function(){
    try{
      if(!window.claude)return;
      var r=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
      var db=r[0],user=r[1]; if(!db||!user)return;
      var id=await user.id();
      var c=db.collection("data/users/"+id);
      // one-time move of any browser-only trips into the account
      var local=trips.slice();
      c.onSnapshot(function(snap){
        snap.docs.forEach(function(d){if(d.id==='profile'){var p=d.data()||{};PF.forEach(function(k){if(p[k]&&!$(k).value)$(k).value=p[k]})}});trips=snap.docs.map(function(d){return d.data()}).filter(function(t){return t&&typeof t.miles==="number"&&t.date});
        col=c;$("where").textContent="Saved to your account. Private to you.";render();
      },function(){fallback()});
      for(var i=0;i<local.length;i++){try{await c.doc(local[i].id).set(local[i])}catch(e){break}}
      try{localStorage.removeItem(K)}catch(e){}
    }catch(e){}
  })();
})();
